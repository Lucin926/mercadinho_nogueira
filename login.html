<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Entrar · Nogueira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 40px 20px;
      background:
        radial-gradient(60% 50% at 50% 0%, var(--purple-50), transparent 70%),
        var(--ivory);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .login-brand-mark {
      width: 46px;
      height: 46px;
      display: block;
    }

    .login-brand-text strong {
      display: block;
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.01em;
    }

    .login-brand-text small {
      display: block;
      color: var(--ink-soft);
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 2px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--paper);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    .login-card-head {
      margin-bottom: 26px;
      text-align: center;
    }

    .login-card-head h2 {
      font-size: 23px;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .login-card-head p {
      color: var(--ink-soft);
      font-size: 13.5px;
      line-height: 1.55;
      font-weight: 500;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: var(--ink-soft);
      font-size: 12.5px;
      font-weight: 700;
    }

    .login-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 15px;
      background: var(--paper);
      transition:
        border-color .18s var(--ease),
        box-shadow .18s var(--ease);
    }

    .login-input-wrap:focus-within {
      border-color: var(--purple-400);
      box-shadow: 0 0 0 4px var(--purple-50);
    }

    .login-input-wrap .ico {
      color: var(--ink-faint);
    }

    .login-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink);
      padding: 13px 0;
      font-size: 14px;
      font-weight: 500;
    }

    .password-toggle {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--ink-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .password-toggle:hover {
      background: var(--purple-50);
      color: var(--purple-600);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      font-size: 12.5px;
      font-weight: 600;
    }

    .remember input {
      accent-color: var(--purple-500);
    }

    .login-error {
      display: none;
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(229, 72, 77, .22);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      line-height: 1.5;
      font-weight: 500;
    }

    .login-error.is-show {
      display: block;
    }

    .login-submit {
      width: 100%;
      justify-content: center;
      margin-top: 4px;
      padding: 14px 20px;
    }

    /* pequenas informações básicas, discretas, abaixo do card */
    .login-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--ink-faint);
      font-size: 12px;
      font-weight: 600;
    }

    .login-info span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .login-info .ico {
      width: 15px;
      height: 15px;
      color: var(--purple-400);
    }

    .login-footer {
      color: var(--ink-faint);
      font-size: 11.5px;
      font-weight: 500;
      text-align: center;
    }

    .login-theme {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--paper);
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      z-index: 20;
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 28px 22px;
      }

      .login-card-head h2 {
        font-size: 21px;
      }

      .login-options {
        align-items: flex-start;
        flex-direction: column;
      }

      .login-info {
        gap: 12px 16px;
      }
    }
  </style>
</head>

<body>

  <button
    class="login-theme"
    id="btnLoginTheme"
    type="button"
    aria-label="Alternar tema"
    title="Alternar tema"
  >
    <span class="ico" id="loginThemeIcon"></span>
  </button>

  <main class="login-page">

    <div class="login-brand">

      <span
        class="login-brand-mark"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 40 40"
          fill="none"
        >
          <path
            d="M20 3C13 8 8 13 8 21c0 6.6 5.4 12 12 12s12-5.4 12-12c0-8-5-13-12-18Z"
            fill="url(#loginGradient)"
          />

          <path
            d="M20 9c0 8 0 16 0 24"
            stroke="#fff"
            stroke-opacity=".55"
            stroke-width="1.4"
            stroke-linecap="round"
          />

          <path
            d="M20 15c-2.6 1.6-4.4 3-4.4 5.4M20 21c2.6 1.6 4.4 3 4.4 5.4"
            stroke="#fff"
            stroke-opacity=".4"
            stroke-width="1.2"
            stroke-linecap="round"
          />

          <defs>
            <linearGradient
              id="loginGradient"
              x1="8"
              y1="3"
              x2="32"
              y2="33"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#B584F0" />
              <stop offset="1" stop-color="#820AD1" />
            </linearGradient>
          </defs>
        </svg>
      </span>

      <div class="login-brand-text">
        <strong>Nogueira</strong>
        <small>Gestão de contas</small>
      </div>

    </div>

    <div class="login-card">

      <div class="login-card-head">
        <h2>Bem-vindo</h2>

        <p>
          Entre com seu usuário ou e-mail para acessar
          a Caderneta Digital.
        </p>
      </div>

      <form
        class="login-form"
        id="loginForm"
        novalidate
      >

        <div
          class="login-error"
          id="loginError"
          role="alert"
        ></div>

        <label class="login-label">

          Usuário ou e-mail

          <div class="login-input-wrap">

            <span
              class="ico"
              id="loginUserIcon"
            ></span>

            <input
              class="login-input"
              id="loginUsuario"
              name="usuario"
              type="text"
              placeholder="Digite seu usuário"
              autocomplete="username"
              maxlength="150"
              required
            />

          </div>

        </label>

        <label class="login-label">

          Senha

          <div class="login-input-wrap">

            <span
              class="ico"
              id="loginPasswordIcon"
            ></span>

            <input
              class="login-input"
              id="loginSenha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              maxlength="72"
              required
            />

            <button
              class="password-toggle"
              id="btnTogglePassword"
              type="button"
              aria-label="Mostrar senha"
            >
              <span
                class="ico"
                id="passwordToggleIcon"
              ></span>
            </button>

          </div>

        </label>

        <div class="login-options">

          <label class="remember">

            <input
              type="checkbox"
              id="lembrarUsuario"
            />

            Lembrar meu usuário

          </label>

        </div>

        <button
          class="btn btn-primary login-submit"
          id="btnLogin"
          type="submit"
        >
          Entrar
        </button>

      </form>

    </div>

    <div class="login-info">
      <span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        Acesso seguro
      </span>
      <span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        Histórico completo
      </span>
      <span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12s3.4-6 8-6 8 6 8 6-3.4 6-8 6-8-6-8-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        Contas sempre à vista
      </span>
    </div>

    <div class="login-footer">
      Caderneta Digital · Mercadinho Nogueira
    </div>

  </main>

  <script>
    // ============================================================
    // CONFIGURAÇÕES
    // ============================================================

    const API_BASE_URL =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
    ? "http://localhost:3000/api"
    : "https://mercadinho-nogueira.onrender.com/api";

    const TOKEN_KEY =
      "caderneta_token";

    const USER_KEY =
      "caderneta_usuario";

    const THEME_KEY =
      "caderneta_tema";

    const REMEMBER_KEY =
      "caderneta_login_lembrado";


    // ============================================================
    // ÍCONES DA TELA DE LOGIN
    // ============================================================

    const LOGIN_ICONS = {
      user: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6"/>
          <path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>
        </svg>
      `,

      lock: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="10.5" width="14" height="9.5" rx="2"/>
          <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
        </svg>
      `,

      eye: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z"/>
          <circle cx="12" cy="12" r="2.6"/>
        </svg>
      `,

      eyeOff: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3l18 18"/>
          <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5.8 0 9.2 6 9.2 6a16 16 0 0 1-2.1 2.8"/>
          <path d="M6.1 6.1C4 7.7 2.8 12 2.8 12s3.4 6 9.2 6a9.9 9.9 0 0 0 4.1-.9"/>
        </svg>
      `,

      sun: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      `,

      moon: `
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 15.2A8 8 0 0 1 8.8 4 8 8 0 1 0 20 15.2Z"/>
        </svg>
      `,
    };


    // ============================================================
    // ELEMENTOS
    // ============================================================

    const loginForm =
      document.getElementById(
        "loginForm",
      );

    const loginUsuario =
      document.getElementById(
        "loginUsuario",
      );

    const loginSenha =
      document.getElementById(
        "loginSenha",
      );

    const loginError =
      document.getElementById(
        "loginError",
      );

    const btnLogin =
      document.getElementById(
        "btnLogin",
      );

    const btnTogglePassword =
      document.getElementById(
        "btnTogglePassword",
      );

    const passwordToggleIcon =
      document.getElementById(
        "passwordToggleIcon",
      );

    const lembrarUsuario =
      document.getElementById(
        "lembrarUsuario",
      );

    const btnLoginTheme =
      document.getElementById(
        "btnLoginTheme",
      );

    const loginThemeIcon =
      document.getElementById(
        "loginThemeIcon",
      );


    // ============================================================
    // PINTAR ÍCONES
    // ============================================================

    document.getElementById(
      "loginUserIcon",
    ).innerHTML =
      LOGIN_ICONS.user;

    document.getElementById(
      "loginPasswordIcon",
    ).innerHTML =
      LOGIN_ICONS.lock;

    passwordToggleIcon.innerHTML =
      LOGIN_ICONS.eye;


    // ============================================================
    // ERRO
    // ============================================================

    function mostrarErro(mensagem) {
      loginError.textContent =
        mensagem;

      loginError.classList.add(
        "is-show",
      );
    }


    function limparErro() {
      loginError.textContent =
        "";

      loginError.classList.remove(
        "is-show",
      );
    }


    // ============================================================
    // CARREGAMENTO
    // ============================================================

    function definirCarregamento(
      carregando,
    ) {
      btnLogin.disabled =
        carregando;

      btnLogin.textContent =
        carregando
          ? "Entrando..."
          : "Entrar";
    }


    // ============================================================
    // TEMA
    // ============================================================

    function aplicarTema(tema) {
      const temaValido =
        tema === "dark"
          ? "dark"
          : "light";

      document.documentElement
        .setAttribute(
          "data-theme",
          temaValido,
        );

      localStorage.setItem(
        THEME_KEY,
        temaValido,
      );

      loginThemeIcon.innerHTML =
        temaValido === "dark"
          ? LOGIN_ICONS.sun
          : LOGIN_ICONS.moon;
    }


    function carregarTema() {
      const temaSalvo =
        localStorage.getItem(
          THEME_KEY,
        );

      if (temaSalvo) {
        aplicarTema(
          temaSalvo,
        );

        return;
      }

      const prefereEscuro =
        window.matchMedia &&
        window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;

      aplicarTema(
        prefereEscuro
          ? "dark"
          : "light",
      );
    }


    btnLoginTheme.addEventListener(
      "click",
      () => {
        const temaAtual =
          document.documentElement
            .getAttribute(
              "data-theme",
            );

        aplicarTema(
          temaAtual === "dark"
            ? "light"
            : "dark",
        );
      },
    );


    // ============================================================
    // MOSTRAR E OCULTAR SENHA
    // ============================================================

    btnTogglePassword.addEventListener(
      "click",
      () => {
        const mostrando =
          loginSenha.type ===
          "text";

        loginSenha.type =
          mostrando
            ? "password"
            : "text";

        passwordToggleIcon.innerHTML =
          mostrando
            ? LOGIN_ICONS.eye
            : LOGIN_ICONS.eyeOff;

        btnTogglePassword
          .setAttribute(
            "aria-label",
            mostrando
              ? "Mostrar senha"
              : "Ocultar senha",
          );
      },
    );


    // ============================================================
    // USUÁRIO LEMBRADO
    // ============================================================

    function carregarUsuarioLembrado() {
      const usuario =
        localStorage.getItem(
          REMEMBER_KEY,
        );

      if (usuario) {
        loginUsuario.value =
          usuario;

        lembrarUsuario.checked =
          true;

        loginSenha.focus();
      }
    }


    function salvarUsuarioLembrado() {
      if (
        lembrarUsuario.checked
      ) {
        localStorage.setItem(
          REMEMBER_KEY,
          loginUsuario.value.trim(),
        );

        return;
      }

      localStorage.removeItem(
        REMEMBER_KEY,
      );
    }


    // ============================================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // ============================================================

    function verificarSessaoExistente() {
      const token =
        localStorage.getItem(
          TOKEN_KEY,
        );

      if (token) {
        window.location.href =
          "index.html";
      }
    }


    // ============================================================
    // LOGIN
    // ============================================================

    loginForm.addEventListener(
      "submit",
      async (evento) => {
        evento.preventDefault();

        limparErro();

        const usuario =
          loginUsuario.value.trim();

        const senha =
          loginSenha.value;

        if (!usuario) {
          mostrarErro(
            "Informe seu usuário ou e-mail.",
          );

          loginUsuario.focus();

          return;
        }

        if (!senha) {
          mostrarErro(
            "Informe sua senha.",
          );

          loginSenha.focus();

          return;
        }

        definirCarregamento(
          true,
        );

        try {
          const resposta =
            await fetch(
              `${API_BASE_URL}/auth/login`,
              {
                method:
                  "POST",

                headers: {
                  "Content-Type":
                    "application/json",
                },

                body:
                  JSON.stringify({
                    usuario,
                    senha,
                  }),
              },
            );

          let resultado =
            null;

          try {
            resultado =
              await resposta.json();
          } catch {
            resultado =
              null;
          }

          if (!resposta.ok) {
            throw new Error(
              resultado?.mensagem ||
                "Não foi possível entrar no sistema.",
            );
          }

          const token =
            resultado.dados.token;

          const usuarioLogado =
            resultado.dados.usuario;

          localStorage.setItem(
            TOKEN_KEY,
            token,
          );

          localStorage.setItem(
            USER_KEY,
            JSON.stringify(
              usuarioLogado,
            ),
          );

          salvarUsuarioLembrado();

          window.location.href =
            "index.html";
        } catch (erro) {
          mostrarErro(
            erro.message ||
              "Não foi possível conectar ao servidor.",
          );
        } finally {
          definirCarregamento(
            false,
          );
        }
      },
    );


    // ============================================================
    // LIMPAR ERRO AO DIGITAR
    // ============================================================

    [
      loginUsuario,
      loginSenha,
    ].forEach(
      (campo) => {
        campo.addEventListener(
          "input",
          limparErro,
        );
      },
    );


    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================

    carregarTema();

    carregarUsuarioLembrado();

    verificarSessaoExistente();

    if (!loginUsuario.value) {
      loginUsuario.focus();
    }
  </script>

</body>
</html>
